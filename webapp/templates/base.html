<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SQL Query Compiler & Optimizer{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts (Inter + JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CodeMirror 5 CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="bg-body">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary-subtle px-3 py-2 sticky-top bg-body-tertiary">
        <div class="container-fluid px-0">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
                <span class="brand-icon"><i class="bi bi-cpu-fill text-primary"></i></span>
                <span>SQL Query Compiler & Optimizer</span>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle ms-2 fw-normal d-none d-md-inline">Flex • Bison • C11</span>
            </a>

            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary btn-sm" id="btn-theme-toggle" title="Toggle dark/light theme">
                    <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
                </button>
                <button class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1" id="btn-reset-workspace-nav" title="Restore default sample CSV tables">
                    <i class="bi bi-arrow-counterclockwise"></i>
                    <span class="d-none d-sm-inline">Reset Workspace</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container-fluid py-3 px-3">
        {% block content %}{% endblock %}
    </main>

    <!-- CodeMirror 5 JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom App JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
